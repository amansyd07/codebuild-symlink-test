version: 0.2
phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Install phase started"
  pre_build:
    commands:
      - echo "Pre-build phase started"
      - npm install
  build:
    commands:
      - echo "Build phase started"
      - npm run build
artifacts:
  files:
    - '**/*'
